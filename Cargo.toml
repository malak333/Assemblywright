[workspace]
members = [
  "crates/jarvis-protocol",
  "crates/jarvis-master",
  "crates/jarvis-core",
  "crates/jarvis-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/malak333/Jarvis"
rust-version = "1.86"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
core-foundation-sys = "0.8"
ed25519-dalek = "2.1"
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.3"
hyper = { version = "1.5", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rcgen = { version = "0.14.8", features = ["x509-parser", "zeroize"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.13"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.41", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
wasmi = { version = "1.1", default-features = false, features = ["std", "extra-checks"] }
wat = "1.0"
windows-service = "0.8.1"
x509-parser = "0.18"
zeroize = "1.8"

[workspace.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Cryptography",
]
