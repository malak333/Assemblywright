name: Assemblywright Windows Local Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assemblywright-windows-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-local-gui:
    name: Windows local ChatGPT and GUI
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Test isolated ChatGPT planning and review boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Path target/windows-ci -Force | Out-Null
          & cargo test -p assemblywright-master --features local-chatgpt-test-fixture --target-dir target/chatgpt-test-target --test windows_local_pipeline_e2e chatgpt_ --locked -- --nocapture *>&1 |
            Tee-Object -FilePath target/windows-ci/chatgpt-fixture-e2e.log
          $fixtureExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($fixtureExit -ne 0) { throw "The isolated ChatGPT fixture E2E suite failed with exit code $fixtureExit." }

      - name: Test Windows-only CI scope selection
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -File ./scripts/test-release-local-selector-cli.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The Windows-only CI scope native CLI regression failed.' }
          & ./scripts/test-release-local-selector.ps1 -EvidencePath target/windows-ci/windows-ci-scope.json
          if ($LASTEXITCODE -ne 0) { throw 'The Windows-only CI scope regression failed.' }

      - name: Test Windows GUI gate failure propagation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-windows-gui-gate.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The Windows GUI gate regression failed.' }

      - name: Test WinForms build, self-tests, and native UI Automation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/validate-windows-gui.ps1 -LiveDemo

      - name: Retain bounded Windows local test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-local-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/windows-ci/chatgpt-fixture-e2e.log
            target/windows-ci/windows-process-capture.json
            target/windows-gui-tests/*/gui-unit-tests.json
            target/windows-ci/windows-gui-gate.json
            target/windows-ci/windows-ci-scope.json
            target/windows-ci/windows-ci-scope-cli.json
            target/windows-gui-tests/*/gui-e2e.json
            target/windows-gui-tests/*/failure.json
