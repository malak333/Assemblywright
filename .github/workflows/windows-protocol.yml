name: Assemblywright Windows Distributed Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assemblywright-windows-protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-windows:
    name: Protocol, master, identity, mTLS, and SCM
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Test live-controller immutable Git blob binding
        shell: powershell
        run: ./scripts/windows-local-coding-live-control.ps1 -Action Check

      - name: Test Windows repository onboarding contract
        shell: powershell
        run: ./scripts/windows-repository-onboarding.ps1 -Action SelfTest

      - name: Test real Windows repository onboarding boundary
        run: cargo test -p assemblywright-master --test windows_repository_onboarding_e2e --locked -- --nocapture

      - name: Test Windows owner evidence admission validation
        shell: powershell
        run: ./scripts/windows-owner-evidence-admission.ps1 -Action SelfTest

      - name: Test Windows execution-host service SID boundary
        shell: powershell
        run: ./scripts/windows-execution-host-security-e2e.ps1 -Confirm

      - name: Test Windows GitHub authentication exit-code handling
        shell: powershell
        run: ./scripts/windows-github-publication-live-control.ps1 -Action SelfTest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint portable protocol contracts
        run: cargo clippy -p assemblywright-protocol --all-targets --locked -- -D warnings

      - name: Lint master process, identity, and transport
        run: cargo clippy -p assemblywright-master --all-targets --locked -- -D warnings

      - name: Lint Windows executor and privileged broker
        run: cargo clippy -p assemblywright-broker -p assemblywright-executor --all-targets --locked -- -D warnings

      - name: Test portable protocol contracts
        run: cargo test -p assemblywright-protocol --locked

      - name: Test master process, identity, and mTLS transport
        run: cargo test -p assemblywright-master --locked

      - name: Test Windows executor and privileged broker containment
        run: |
          cargo test -p assemblywright-broker --locked -- --nocapture
          cargo test -p assemblywright-executor --locked -- --nocapture

      - name: Test real Windows service lifecycle
        env:
          ASSEMBLYWRIGHT_REQUIRE_WINDOWS_SERVICE_E2E: "1"
        run: |
          cargo test -p assemblywright-master --bin assemblywright-master service_logon_right_is_ensured_for_current_account --locked -- --ignored --nocapture
          cargo test -p assemblywright-master --test windows_service_lifecycle_e2e --locked -- --ignored --nocapture
