name: Jarvis Windows Distributed Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-windows-protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-windows:
    name: Portable protocol and master process
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint portable protocol contracts
        run: cargo clippy -p jarvis-protocol --all-targets --locked -- -D warnings

      - name: Lint portable master process
        run: cargo clippy -p jarvis-master --all-targets --locked -- -D warnings

      - name: Test portable protocol contracts
        run: cargo test -p jarvis-protocol --locked

      - name: Test portable master process
        run: cargo test -p jarvis-master --locked
