name: Assemblywright Windows Distributed Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-windows-protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-windows:
    name: Protocol, master, identity, mTLS, and SCM
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint portable protocol contracts
        run: cargo clippy -p assemblywright-protocol --all-targets --locked -- -D warnings

      - name: Lint master process, identity, and transport
        run: cargo clippy -p assemblywright-master --all-targets --locked -- -D warnings

      - name: Test portable protocol contracts
        run: cargo test -p assemblywright-protocol --locked

      - name: Test master process, identity, and mTLS transport
        run: cargo test -p assemblywright-master --locked

      - name: Test real Windows service lifecycle
        env:
          JARVIS_REQUIRE_WINDOWS_SERVICE_E2E: "1"
        run: |
          cargo test -p assemblywright-master --bin jarvis-master service_logon_right_is_ensured_for_current_account --locked -- --ignored --nocapture
          cargo test -p assemblywright-master --test windows_service_lifecycle_e2e --locked -- --ignored --nocapture
