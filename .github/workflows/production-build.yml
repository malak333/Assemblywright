name: Assemblywright Production Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assemblywright-production-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-windows:
    name: Production Windows runner
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
      - name: Build production supervised runner
        run: cargo build --release -p assemblywright-master --bin assemblywright-developer --locked
