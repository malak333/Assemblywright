name: Assemblywright Release Local Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-release-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-local:
    name: Release local gate
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          swift --version

      - name: Run local release verification
        env:
          JARVIS_RELEASE_LOCAL_HEARTBEAT_SECONDS: "60"
        run: ./scripts/release-local.sh
