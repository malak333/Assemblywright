[package]
name = "assemblywright-core"
version = "0.1.4"
description = "Local Unix-domain-socket transport and release evidence foundation for Assemblywright."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
distributed-development = ["dep:assemblywright-protocol"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
assemblywright-protocol = { path = "../assemblywright-protocol", version = "0.1.4", optional = true }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys.workspace = true
