[package]
name = "jarvis-agent"
version = "0.1.4"
description = "App-supervised Mac control-plane relay for Assemblywright Developer Mode."
default-run = "assemblywright-agent"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "assemblywright-agent"
path = "src/bin/assemblywright-agent.rs"

[[bin]]
name = "jarvis-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
fs2.workspace = true
jarvis-core = { path = "../jarvis-core", version = "0.1.4" }
jarvis-protocol = { path = "../jarvis-protocol", version = "0.1.4" }
libc.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
