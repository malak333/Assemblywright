[package]
name = "jarvis-cli"
version = "0.1.4"
description = "Read-only release readiness and evidence CLI for Assemblywright."
default-run = "assemblywright"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "assemblywright"
path = "src/bin/assemblywright.rs"

[[bin]]
name = "jarvis"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
jarvis-core = { path = "../jarvis-core", version = "0.1.4" }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
